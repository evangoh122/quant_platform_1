name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify the lockfile matches pyproject.toml
        run: uv lock --check

      - name: Install Python dependencies
        # --frozen: install exactly the committed uv.lock. pyspark is NOT a
        # dependency, so it stays absent (CI parity with the deployed runtime).
        # ibapi is not on PyPI and is deliberately absent from the lock;
        # conftest.py stubs it for the offline suite.
        run: uv sync --frozen --group dev

      - name: Verify generated requirements.txt is in sync with uv.lock
        # requirements.txt is a committed export of the runtime group: fail if
        # it was not regenerated after a dependency change.
        run: |
          ./scripts/export_requirements.sh
          git diff --exit-code -- requirements.txt

      - name: Assert no PyPI-unavailable packages entered the lock
        # ibapi (IBKR TWS API) is installed manually from IBKR, never from PyPI.
        shell: bash
        run: |
          if grep -qiE '^name = "ibapi"$' uv.lock; then
            echo "ibapi must not be in uv.lock (not on PyPI)" >&2
            exit 1
          fi

      - name: Run offline test suite
        run: uv run pytest -q -m "not spark and not lakebase and not databricks"

      - name: Run streaming bundle tests
        if: ${{ hashFiles('bundles/streaming/tests/**') != '' }}
        run: uv run pytest -q bundles/streaming/tests

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Detect frontend
        id: frontend
        shell: bash
        run: |
          if [[ -f frontend/package.json ]]; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up Node.js
        if: ${{ steps.frontend.outputs.exists == 'true' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: ${{ steps.frontend.outputs.exists == 'true' }}
        working-directory: frontend
        run: npm ci

      - name: Type-check frontend
        if: ${{ steps.frontend.outputs.exists == 'true' }}
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build frontend
        if: ${{ steps.frontend.outputs.exists == 'true' }}
        working-directory: frontend
        run: npm run build

  bundle-validate:
    name: Validate Databricks bundles
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST || secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID || secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Explain skipped validation
        if: ${{ env.DATABRICKS_HOST == '' || (env.DATABRICKS_CLIENT_ID == '' && env.DATABRICKS_TOKEN == '') }}
        run: echo "Databricks credentials are incomplete; skipping workspace-backed bundle validation."

      - name: Set up Databricks CLI
        if: ${{ env.DATABRICKS_HOST != '' && (env.DATABRICKS_CLIENT_ID != '' || env.DATABRICKS_TOKEN != '') }}
        uses: databricks/setup-cli@095d26a91ccd1ff8860b6832b0739d71f21ced75 # v0.276.0

      - name: Validate root bundle
        if: ${{ env.DATABRICKS_HOST != '' && (env.DATABRICKS_CLIENT_ID != '' || env.DATABRICKS_TOKEN != '') }}
        run: databricks bundle validate -t dev

      - name: Validate streaming bundle
        if: ${{ env.DATABRICKS_HOST != '' && (env.DATABRICKS_CLIENT_ID != '' || env.DATABRICKS_TOKEN != '') && hashFiles('bundles/streaming/databricks.yml') != '' }}
        working-directory: bundles/streaming
        run: databricks bundle validate -t dev

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install audit tooling
        # pip-audit lives in the dev group so the audited set and the test set
        # come from the same uv.lock resolution.
        run: uv sync --frozen --group dev

      - name: Build ignore args
        id: ignore
        shell: bash
        run: |
          args=""
          if [[ -f security/pip-audit-ignore.txt ]]; then
            # one vuln ID per non-comment, non-blank line
            for id in $(grep -vE '^[[:space:]]*(#|$)' security/pip-audit-ignore.txt | awk '{print $1}'); do
              args="$args --ignore-vuln $id"
            done
          fi
          echo "args=$args" >> "${GITHUB_OUTPUT}"

      - name: Audit the runtime dependency set
        # Audits the exact runtime set Databricks Apps / the Docker image
        # installs: the export of the locked runtime group (ibapi is not on
        # PyPI and never enters the lock).
        shell: bash
        run: |
          set -o pipefail
          uv export --frozen --no-dev --no-hashes \
            | uv run pip-audit -r /dev/stdin ${{ steps.ignore.outputs.args }}

      - name: Audit the CI/development dependency set
        # Audits the environment uv built from the lock (runtime + dev). This is
        # the same resolved set as `uv export`, and unlike a pip re-resolution it
        # honours [tool.uv].override-dependencies. Previously the retired app
        # requirements file pulled the full runtime range set; coverage is kept.
        shell: bash
        run: |
          uv run pip-audit ${{ steps.ignore.outputs.args }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit frontend dependencies
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
