name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-app.txt
            requirements-dev.txt

      - name: Install Python dependencies
        shell: bash
        run: |
          grep -viE '^[[:space:]]*ibapi([<=>~!]|$)' requirements.txt > "${RUNNER_TEMP}/requirements-no-ibapi.txt"
          python -m pip install --upgrade pip
          python -m pip install -r "${RUNNER_TEMP}/requirements-no-ibapi.txt"
          if [[ -f requirements-app.txt ]]; then
            python -m pip install -r requirements-app.txt
          fi
          if [[ -f requirements-dev.txt ]]; then
            # drop ibapi (not on PyPI) and the '-r requirements.txt' include (already installed above;
            # relative includes would not resolve from RUNNER_TEMP)
            grep -viE '^[[:space:]]*(ibapi([<=>~!]|$)|-r[[:space:]])' requirements-dev.txt > "${RUNNER_TEMP}/requirements-dev-no-ibapi.txt"
            python -m pip install -r "${RUNNER_TEMP}/requirements-dev-no-ibapi.txt"
          fi
          python -m pip install pytest pytest-asyncio pytest-timeout httpx numpy pandas polars duckdb scikit-learn pyyaml

      - name: Run offline test suite
        run: pytest -q -m "not spark and not lakebase and not databricks"

      - name: Run streaming bundle tests
        if: ${{ hashFiles('bundles/streaming/tests/**') != '' }}
        run: pytest -q bundles/streaming/tests

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Detect frontend
        id: frontend
        shell: bash
        run: |
          if [[ -f frontend/package.json ]]; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up Node.js
        if: ${{ steps.frontend.outputs.exists == 'true' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: ${{ steps.frontend.outputs.exists == 'true' }}
        working-directory: frontend
        run: npm ci

      - name: Type-check frontend
        if: ${{ steps.frontend.outputs.exists == 'true' }}
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build frontend
        if: ${{ steps.frontend.outputs.exists == 'true' }}
        working-directory: frontend
        run: npm run build

  bundle-validate:
    name: Validate Databricks bundles
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST || secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID || secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Explain skipped validation
        if: ${{ env.DATABRICKS_HOST == '' || (env.DATABRICKS_CLIENT_ID == '' && env.DATABRICKS_TOKEN == '') }}
        run: echo "Databricks credentials are incomplete; skipping workspace-backed bundle validation."

      - name: Set up Databricks CLI
        if: ${{ env.DATABRICKS_HOST != '' && (env.DATABRICKS_CLIENT_ID != '' || env.DATABRICKS_TOKEN != '') }}
        uses: databricks/setup-cli@095d26a91ccd1ff8860b6832b0739d71f21ced75 # v0.276.0

      - name: Validate root bundle
        if: ${{ env.DATABRICKS_HOST != '' && (env.DATABRICKS_CLIENT_ID != '' || env.DATABRICKS_TOKEN != '') }}
        run: databricks bundle validate -t dev

      - name: Validate streaming bundle
        if: ${{ env.DATABRICKS_HOST != '' && (env.DATABRICKS_CLIENT_ID != '' || env.DATABRICKS_TOKEN != '') && hashFiles('bundles/streaming/databricks.yml') != '' }}
        working-directory: bundles/streaming
        run: databricks bundle validate -t dev

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Build ignore args
        id: ignore
        shell: bash
        run: |
          args=""
          if [[ -f security/pip-audit-ignore.txt ]]; then
            while IFS= read -r line; do
              # skip comments and blanks
              [[ "$line" =~ ^[[:space:]]*# ]] && continue
              [[ -z "$line" ]] && continue
              args="$args --ignore-vuln $line"
            done < security/pip-audit-ignore.txt
          fi
          echo "args=$args" >> "${GITHUB_OUTPUT}"

      - name: Audit requirements-render.txt
        shell: bash
        run: |
          pip-audit -r requirements-render.txt ${{ steps.ignore.outputs.args }}

      - name: Audit requirements-app.txt
        shell: bash
        run: |
          pip-audit -r requirements-app.txt ${{ steps.ignore.outputs.args }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit frontend dependencies
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
