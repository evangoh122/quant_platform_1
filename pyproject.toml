# pyproject.toml — THE source of truth for Python dependencies.
#
# `uv.lock` is generated from this file (`uv lock`) and committed. Developers
# and CI install with `uv sync --frozen` (`--group dev` for the test/ML tools)
# and run commands through `uv run`.
#
# Databricks Apps: the docs (docs/DEPLOYMENT.md §Dependencies) state that an app
# installs from `pyproject.toml` + `uv.lock` when no root `requirements.txt`
# exists.  We nevertheless keep a GENERATED root `requirements.txt` (see
# `scripts/export_requirements.sh`) because a `requirements.txt`, when present,
# takes precedence and keeps pip-based / UI-driven app deployments working
# exactly as before.  Never edit it by hand; CI fails on export drift.
#
# ibapi is NOT on PyPI (it is downloaded from Interactive Brokers).  It is
# intentionally absent here and from the lock so `uv sync` always succeeds;
# `conftest.py` stubs it for tests and `etl/ibkr_client.py` needs a manual
# install (`python -m pip install <IBKR TWS API zip>`) only for live paper
# trading.  See docs/CICD.md §ibapi.
[project]
name = "quant-platform"
version = "0.1.0"
description = "Databricks-native quant research platform: FastAPI app, agent tooling and medallion pipelines."
readme = "README.md"
requires-python = ">=3.12,<3.13"

# Runtime dependencies.  Specifiers are carried over VERBATIM from the
# historical root requirements.txt so `uv lock` cannot silently change what the
# Databricks App installs.  Comments kept with the declarations they explain.
dependencies = [
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.0",
    "databricks-sdk>=0.20.0",
    "databricks-sql-connector>=3.0.0,<5",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.1",
    "loguru>=0.7.0",
    "requests>=2.33.0",
    "tenacity>=8.2.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "polars>=0.20.0",
    "openai>=1.0.0",
    "langchain-core>=1.2.22",
    "langchain-openai>=0.1.0",
    "langgraph>=0.0.20",
    "sentence-transformers>=2.2.0",
    "rank-bm25>=0.2.2",
    "huggingface-hub>=0.19.0",
    "duckdb>=0.10.0",
    # pytz: duckdb's Python client converts timezone-aware TIMESTAMP results via
    # pytz, so tz-aware fetches raise InvalidInputException ("Required module
    # 'pytz' failed to import") without it.  Previously pulled in transitively via
    # yfinance; declared explicitly because api/ code paths use duckdb at runtime
    # (api/services/runtime_snapshot.py) and tests fetch tz-aware results.
    "pytz>=2023.3",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "langsmith>=0.8.18",
    "edgartools>=2.0.0",
    "finvizfinance>=0.14.0",
    # oauthlib: transitive via databricks-sql-connector (requires ^3.1.0, i.e. <4).
    # PYSEC-2026-4114 (CVE-2026-49265) is a PKCE timing side-channel fixed in 4.0.0.
    # Accepted risk: databricks-sql-connector caps oauthlib<4; see docs/SECURITY.md.
    "oauthlib>=3.1.0,<4",
]

# CI / pipeline / ML dependencies NOT needed by the app.  Historically
# requirements-dev.txt (which this group replaces).
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.2.0",
    "httpx>=0.27",
    "scikit-learn>=1.4",
    "mlflow>=2.10.0",
    "langchain>=1.0.0",
    "langchain-community>=0.3.27",
    "polygon-api-client>=1.12.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.2",
    # Optional drift monitoring (ml/monitoring.py) — dev/CI tooling only, imported
    # lazily; the module and its tests work without it.  Pin carried over from the
    # parallel chore/evidently-drift-cleanup branch so the two agree.
    "evidently==0.7.23",
    # Dependency audit (CI security-audit job); audits the exported runtime set.
    "pip-audit>=2.7",
    # Tests use legacy IANA aliases such as "US/Eastern"; minimal Linux images
    # (and some hosts) ship only the canonical zoneinfo tree, so the IANA
    # database is a test dependency.  system tzdata still wins when present.
    "tzdata>=2024.1",
]

# This repo is an application, not an installable distribution: `uv sync` must
# not try to build/install the project itself, and `uv export` must not emit it.
[tool.uv]
package = false
