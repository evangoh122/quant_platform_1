resources:
  pipelines:
    streaming_dlt_pipeline:
      name: "[${bundle.target}] ohlcv_streaming_dlt"
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      continuous: true
      development: ${var.pipeline_development}
      channel: ${var.pipeline_channel}
      photon: true
      root_path: ../src/pipelines/streaming
      libraries:
        - glob:
            include: ../src/pipelines/streaming/transformations/**
      configuration:
        source_catalog: ${var.source_catalog}
        source_schema: ${var.source_schema}
        source_table: ${var.source_table}
        spark.sql.session.timeZone: UTC
      environment:
        dependencies:
          - --editable ${workspace.file_path}
      permissions:
        - level: CAN_VIEW
          group_name: users
