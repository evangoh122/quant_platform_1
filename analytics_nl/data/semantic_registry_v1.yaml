# NL1 Semantic Registry v1
# Single source of all approved SQL identifiers and metric×operation semantics.
# Runtime Python must not duplicate any identifier allowlist.

semantic_registry_version: "1.0.0"
semantic_model_version: "1.0.0"
policy_version: "1.0.0"

approved_views:
  - serve_daily_prices_v1
  - serve_daily_equity_metrics_v1
  - serve_relative_performance_v1
  - serve_options_metrics_v1
  - serve_bounded_daily_bars_v1

entries:
  # ── price × operations ──────────────────────────────────────────────
  price.trend:
    layer: silver
    serving_view: serve_bounded_daily_bars_v1
    description: "Daily unadjusted close price over time for up to 10 named tickers (Silver bounded drill-down)"
    price_adjustment: unadjusted
    input_columns: [symbol, event_date, close_price]
    aggregation: none
    required_slots: [entities, date_range]
    allowed_grouping: [day, week, month, quarter, year]
    allowed_ordering:
      - [event_date, asc]
    parameters:
      entity_count: {type: integer, min: 1, max: 10, default: 1}
    output_fields:
      - {name: symbol, type: string, nullable: false}
      - {name: event_date, type: date, nullable: false}
      - {name: close_price, type: number, nullable: false}
    chart_families: [line, table]
    max_entities: 10
    row_limit: 10000
    entry_version: "1.0.0"

  price.compare:
    layer: gold
    serving_view: serve_daily_prices_v1
    description: "Aligned daily unadjusted prices for named entities over a shared date range"
    price_adjustment: unadjusted
    input_columns: [symbol, event_date, close_price]
    aggregation: none
    required_slots: [entities, date_range]
    allowed_grouping: [day, ticker]
    allowed_ordering:
      - [event_date, asc]
      - [symbol, asc]
    parameters:
      entity_count: {type: integer, min: 2, max: 20, default: 2}
    output_fields:
      - {name: symbol, type: string, nullable: false}
      - {name: event_date, type: date, nullable: false}
      - {name: close_price, type: number, nullable: false}
    chart_families: [line, table]
    max_entities: 20
    min_entities: 2
    row_limit: 5000
    entry_version: "1.0.0"

  price.rank:
    layer: gold
    serving_view: serve_daily_prices_v1
    description: "Latest/as-of unadjusted price for entities ordered by price"
    price_adjustment: unadjusted
    input_columns: [symbol, event_date, close_price]
    aggregation: latest
    required_slots: [entities]
    allowed_grouping: [ticker]
    allowed_ordering:
      - [close_price, desc]
    parameters:
      entity_count: {type: integer, min: 1, max: 100, default: 10}
      as_of: {type: date, required: false}
    output_fields:
      - {name: symbol, type: string, nullable: false}
      - {name: event_date, type: date, nullable: false}
      - {name: close_price, type: number, nullable: false}
    chart_families: [bar, table]
    max_entities: 100
    row_limit: 1000
    entry_version: "1.0.0"

  price.aggregate:
    layer: gold
    serving_view: serve_daily_prices_v1
    description: "Period aggregation of unadjusted prices (mean, min, max over date range)"
