# NL1 Source Schema Truth v1
# Authoritative column lists for source tables referenced by serving views.
# Used by test_source_schema.py to verify all DDL/registry column references exist.

source_schemas_version: "1.0.0"

tables:
  bronze_ohlcv_day:
    columns:
      - symbol
      - event_ts
      - event_date
      - event_year
      - open
      - high
      - low
      - close
      - volume
      - vwap
      - trade_count
      - timespan
      - source
      - source_file
      - ingest_ts

  silver_ohlcv_day_adjusted:
    status: pending_corporate_actions_lane
    columns:
      - symbol
      - event_date
      - event_ts
      - open
      - high
      - low
      - close
      - volume
      - vwap
      - trade_count
      - cumulative_split_ratio
      - price_adjustment_factor
      - adj_open
      - adj_high
      - adj_low
      - adj_close
      - adj_vwap
      - adj_volume
      - raw_overnight_return
      - adjusted_return_1d_unmasked
      - return_1d
      - is_data_quality_break
      - information_available_ts
      - processed_ts

  gold_options_features:
    columns:
      - symbol
      - feature_ts
      - information_available_ts
      - put_volume
      - call_volume
      - put_call_ratio
      - iv_atm
      - iv_25d_put
      - iv_25d_call
      - iv_skew
      - iv_term_slope
      - avg_spread_pct
      - volume_anomaly_zscore
      - oi_concentration
      - net_delta_exposure
      - processed_ts

# Columns defined by serving views (derived or aliased).
# These are not in source tables but are produced by view stages.
derived_columns:
  serve_daily_prices_v1:
    input_from: silver_ohlcv_day_adjusted
    fallback_input_from: bronze_ohlcv_day
    derived:
      - event_date          # from source.event_date
      - open_price          # alias of open (or adj_open when adjusted)
      - high_price          # alias of high (or adj_high when adjusted)
      - low_price           # alias of low (or adj_low when adjusted)
      - close_price         # alias of adj_close (adjusted) or close (unadjusted fallback)
      - volume              # from source.adj_volume (adjusted) or volume (unadjusted fallback)
      - information_available_ts  # from source (adjusted) or derived: to_utc_timestamp(concat(event_date,' 16:30:00'),'America/New_York')

  serve_daily_equity_metrics_v1:
    input_from: serve_daily_prices_v1
    derived:
      - symbol
      - event_date
      - close
      - return_1d           # from silver_ohlcv_day_adjusted.return_1d (NULL on data-quality break) or computed: (close - LAG(close)) / LAG(close)
      - realized_vol_20d    # computed: STDDEV_SAMP(return_1d) * SQRT(252), excludes NULL return_1d
      - drawdown            # computed: (close - MAX(close)) / MAX(close)
      - momentum_20d        # computed: (close / LAG(close, 20)) - 1
      - information_available_ts

  serve_relative_performance_v1:
    input_from: serve_daily_equity_metrics_v1
    derived:
      - symbol
      - event_date
      - return_1d
      - cumulative_return      # computed: EXP(SUM(LN(1 + return_1d))) over window
      - rel_perf               # computed: entity cumulative_return - benchmark cumulative_return
      - benchmark              # parameterized: :benchmark bind parameter (SPY, QQQ, RSP)
      - information_available_ts  # GREATEST of entity and benchmark availability

  serve_options_metrics_v1:
    input_from: gold_options_features
    derived:
      - symbol
      - feature_ts          # from gold_options_features.feature_ts
      - iv_atm
      - put_call_ratio
      - information_available_ts

  serve_bounded_daily_bars_v1:
    input_from: silver_ohlcv_day_adjusted
    fallback_input_from: bronze_ohlcv_day
    derived:
      - event_date
      - open_price          # alias of open (or adj_open when adjusted)
      - high_price          # alias of high (or adj_high when adjusted)
      - low_price           # alias of low (or adj_low when adjusted)
      - close_price         # alias of adj_close (adjusted) or close (unadjusted fallback)
      - volume              # from source.adj_volume (adjusted) or volume (unadjusted fallback)
      - information_available_ts  # from source (adjusted) or derived: to_utc_timestamp(concat(event_date,' 16:30:00'),'America/New_York')
      - suspected_split     # computed: overnight |close/prev_close - 1| >= 0.4 AND ratio near 1/k or k (unadjusted fallback only)