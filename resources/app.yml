resources:
  apps:
    quant_platform:
      name: quant-platform-${bundle.target}
      description: Quant Platform API and web application.
      source_code_path: ..
      config:
        command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
        env:
          - name: CATALOG
            value: bootcamp_students
          - name: SCHEMA
            value: ${var.schema}
          - name: DATABRICKS_WAREHOUSE_ID
            value: b15d3d6f837ba428
          # Lakebase: the app connects as its own service principal (Postgres role created and granted by the
          # database owner — see docs/DEPLOYMENT.md). An app `database` resource would need MANAGE on the instance.
          - name: LAKEBASE_INSTANCE
            value: evangoh-capstone-lakebase
          - name: LAKEBASE_HOST
            value: ep-steep-truth-d1ex36nr.database.us-west-2.cloud.databricks.com
          - name: LAKEBASE_DBNAME
            value: databricks_postgres
          - name: LAKEBASE_USER
            value: 5d55da45-1154-4b01-9838-9e0d2dd80e8e
      resources:
        - name: sql_warehouse
          sql_warehouse:
            id: b15d3d6f837ba428
            permission: CAN_USE