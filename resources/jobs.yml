resources:
  jobs:
    silver_gold_refresh:
      name: quant-platform-silver-gold-refresh-${bundle.target}
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: UTC
        pause_status: PAUSED
      tasks:
        - task_key: refresh_silver_gold
          spark_python_task:
            python_file: ../pipelines/run_silver_gold.py
            parameters: ["--schema", "${var.schema}"]
          environment_key: serverless
      environments:
        - environment_key: serverless
          spec:
            client: "1"

    corporate_action_refresh:
      name: quant-platform-corporate-action-refresh-${bundle.target}
      tasks:
        - task_key: refresh_bronze_corporate_actions
          notebook_task:
            notebook_path: ../notebooks/refresh_bronze_corporate_actions.py
            base_parameters:
              mode: "dry-run"
              source: "massive"
              delay_seconds: "0.5"
          environment_key: serverless
      environments:
        - environment_key: serverless
          spec:
            client: "1"

    ml_ablation:
      name: quant-platform-ml-ablation-${bundle.target}
      tasks:
        - task_key: run_ablation
          spark_python_task:
            python_file: ../ml/run_ablation.py
          environment_key: serverless
      environments:
        - environment_key: serverless
          spec:
            client: "1"

    sec_embeddings:
      name: quant-platform-sec-embeddings-${bundle.target}
      tasks:
        - task_key: build_embeddings
          spark_python_task:
            python_file: ../pipelines/build_sec_embeddings.py
            parameters: ["--catalog", "${var.catalog}", "--schema", "${var.schema}"]
          environment_key: serverless
      environments:
        - environment_key: serverless
          spec:
            client: "1"
            dependencies:
              - "sentence-transformers>=2.2.0"
              - "torch>=2.0.0"
              - "loguru>=0.7.0"
              - "python-dotenv>=1.0.0"

    sec_rag_ingest:
      name: quant-platform-sec-rag-ingest-${bundle.target}
      tasks:
        - task_key: ingest_sec_filings
          spark_python_task:
            python_file: ../pipelines/sec_rag_ingest.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "${var.schema}"
              - "--user-agent-secret-scope"
              - "evangoh_capstone"
              - "--user-agent-secret-key"
              - "sec_edgar_user_agent"
          environment_key: serverless
      environments:
        - environment_key: serverless
          spec:
            client: "1"
            dependencies:
              - "beautifulsoup4>=4.12.0"
              - "lxml>=4.9.0"

    sec_knowledge_graph_build:
      name: quant-platform-sec-kg-build-${bundle.target}
      tasks:
        - task_key: build_sec_kg
          spark_python_task:
            python_file: ../pipelines/build_sec_knowledge_graph.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "${var.schema}"
          environment_key: serverless
      environments:
        - environment_key: serverless
          spec:
            client: "1"

    lakebase_analytics_refresh:
      name: quant-platform-lakebase-analytics-${bundle.target}
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 15 2 * * ?"
        timezone_id: UTC
        pause_status: PAUSED
      tasks:
        - task_key: refresh_analytics
          spark_python_task:
            python_file: ../pipelines/lakebase_analytics.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "${var.schema}"
              - "--batch-size"
              - "5000"
          environment_key: serverless
      environments:
        - environment_key: serverless
          spec:
            client: "1"
