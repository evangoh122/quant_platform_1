tables:
  bronze_ohlcv:
    grain: "One provider bar per (symbol, event_ts, timespan)"
    keys: [symbol, event_ts, timespan]
    pit_column: ingest_ts
    freshness: "Intraday; reject data older than 2 minutes for live decisions"
  bronze_ohlcv_day:
    grain: "One daily bar per (symbol, event_date)"
    keys: [symbol, event_date]
    pit_column: ingest_ts
    freshness: "Daily after the US session close"
  bronze_options_day:
    grain: "One daily option-contract bar per (contract_symbol, event_date)"
    keys: [contract_symbol, event_date]
    pit_column: ingest_ts
    freshness: "Daily after the US session close"
  bronze_fed_series:
    grain: "One observation per (series_id, observation_date)"
    keys: [series_id, observation_date]
    pit_column: information_available_ts
    freshness: "Per source release calendar; never infer availability from observation_date"
  bronze_cftc_fut:
    grain: "One CFTC TFF futures-only report row per (report_date, CFTC_Contract_Market_Code)"
    keys: [report_date, CFTC_Contract_Market_Code]
    pit_column: release_ts
    freshness: "Weekly CFTC release, normally Friday"
  bronze_cot:
    grain: "One normalized COT report per (report_date, market_code)"
    keys: [report_date, market_code]
    pit_column: release_ts
    freshness: "Weekly CFTC release, normally Friday"
  bronze_sec_filings:
    grain: "One SEC filing chunk per (accession_number, chunk_id)"
    keys: [accession_number, chunk_id]
    pit_column: accepted_ts
    freshness: "Event-driven at EDGAR acceptance"
  bronze_sec_filings_v2:
    grain: "One SEC filing chunk per (accession_number, chunk_id)"
    keys: [accession_number, chunk_id]
    pit_column: accepted_ts
    freshness: "Event-driven at EDGAR acceptance"

  silver_ohlcv:
    grain: "One validated bar per (symbol, event_ts, timespan)"
    keys: [symbol, event_ts, timespan]
    pit_column: event_ts
    pit_rule: "Availability is event_ts plus the timespan interval; minute bars are not known at their start timestamp"
    freshness: "Intraday micro-batch; bar availability is bar close, not bar start"
  silver_ohlcv_quarantine:
    grain: "One rejected OHLCV row per source row and validation run"
    keys: [symbol, event_ts, timespan]
    pit_column: ingest_ts
    freshness: "Same batch as silver_ohlcv"
  silver_ohlcv_quarantine_batch:
    grain: "One rejected OHLCV row per (dedup_hash, quarantine_reason)"
    keys: [dedup_hash, quarantine_reason]
    pit_column: ingest_ts
    freshness: "Same batch as silver_ohlcv"
  silver_options_quotes:
    grain: "One cleaned quote per (option_symbol, participant_ts, sequence_id)"
    keys: [option_symbol, participant_ts, sequence_id]
    pit_column: participant_ts
    freshness: "Snapshot/intraday when quote ingestion runs"
  silver_options_trades:
    grain: "One cleaned trade per (option_symbol, participant_ts, sequence_id)"
    keys: [option_symbol, participant_ts, sequence_id]
    pit_column: participant_ts
    freshness: "Intraday when trade ingestion runs"
  silver_cot_positions:
    grain: "One normalized position report per (report_date, market_code)"
    keys: [report_date, market_code]
    pit_column: release_ts
    freshness: "Weekly; information_available_ts equals the CFTC release timestamp"
  silver_sec_sections:
    grain: "One cleaned filing section chunk per (accession_number, chunk_id)"
    keys: [accession_number, chunk_id]
    pit_column: accepted_ts
    freshness: "Event-driven; information_available_ts equals accepted_ts"
  silver_sec_entities:
    grain: "One extracted entity per (accession_number, entity_type, entity_key, period_start, period_end, source_chunk_id)"
    keys: [accession_number, entity_type, entity_key, period_start, period_end, source_chunk_id]
    pit_column: accepted_ts
    freshness: "Event-driven; available no earlier than accepted_ts"
    entity_types: [xbrl_fact, company, event, risk_factor]

  gold_ohlcv_features:
    grain: "One minute feature row per (symbol, feature_ts)"
    keys: [symbol, feature_ts]
    pit_column: information_available_ts
    freshness: "Intraday; minute bars are available at feature_ts plus one minute"
  gold_options_features:
    grain: "One daily options feature row per (symbol, feature_ts)"
    keys: [symbol, feature_ts]
    pit_column: information_available_ts
    freshness: "Daily at 16:00 America/New_York plus the publication buffer"
  gold_regime_features:
    grain: "One daily market-regime row per session_date"
    keys: [session_date]
    pit_column: information_available_ts
    freshness: "Daily after all contributing ETF bars are available"
  gold_tradable_universe:
    grain: "One eligibility row per (symbol, as_of_date)"
    keys: [symbol, as_of_date]
    pit_column: information_available_ts
    freshness: "Daily; computed only from trailing data available by as_of_date"
  gold_cot_features:
    grain: "One COT feature row per (mapped_asset, report_date)"
    keys: [mapped_asset, report_date]
    pit_column: information_available_ts
    freshness: "Weekly at CFTC release; forward-fill only until the next release"
  gold_sec_features:
    grain: "One filing feature row per (ticker, accession_number)"
    keys: [ticker, accession_number]
    pit_column: information_available_ts
    freshness: "Event-driven at accepted_ts"
  gold_sec_chunk_embeddings:
    grain: "One vector per (chunk_id, embedding_model)"
    keys: [chunk_id, embedding_model]
    pit_column: accepted_ts
    freshness: "Batch after the source chunk is accepted; embedded_ts is processing lineage"
  gold_model_features:
    grain: "One point-in-time model snapshot per (symbol, prediction_ts)"
    keys: [symbol, prediction_ts]
    pit_column: prediction_ts
    source_pit_columns: [ohlcv_available_ts, options_available_ts, sec_available_ts, cot_available_ts]
    freshness: "Daily assembly from the latest source rows available at prediction_ts"
    critical_rule: "Every contributing source timestamp must be <= prediction_ts"
  gold_trading_signals:
    grain: "One model prediction per signal_id"
    keys: [signal_id]
    pit_column: prediction_ts
    freshness: "On inference; currently empty"
    status_enum: [ACTIVE, EXPIRED, CONSUMED]
