lineage:
  bronze_ohlcv_to_silver_ohlcv:
    left_table: bronze_ohlcv
    right_table: silver_ohlcv
    keys: [symbol, event_ts, timespan]
  bronze_ohlcv_day_to_silver_ohlcv_day_adjusted:
    left_table: bronze_ohlcv_day
    right_table: silver_ohlcv_day_adjusted
    keys: [symbol, event_date]
    temporal_rule: "The adjusted row is available at 16:30 America/New_York on event_date, converted to UTC; corporate actions contribute only according to their ex_date and availability contract."
    transform: "Deduplicate daily bars, apply cumulative split factors, and mask return_1d when an active data-quality break is unresolved."
  bronze_cftc_fut_to_silver_cot_positions:
    left_table: bronze_cftc_fut
    right_table: silver_cot_positions
    keys: [report_date, market_code]
  bronze_sec_filings_v2_to_silver_sec_sections:
    left_table: bronze_sec_filings_v2
    right_table: silver_sec_sections
    keys: [accession_number, chunk_id]
  bronze_sec_filings_v2_to_silver_sec_entities:
    left_table: bronze_sec_filings_v2
    right_table: silver_sec_entities
    keys: [accession_number]
  silver_ohlcv_to_gold_ohlcv_features:
    left_table: silver_ohlcv
    right_table: gold_ohlcv_features
    keys: [symbol]
    temporal_rule: "feature information_available_ts is event_ts plus the bar interval"
  bronze_options_day_to_gold_options_features:
    left_table: bronze_options_day
    right_table: gold_options_features
    keys: [underlying, symbol]
    temporal_rule: "Daily aggregates become available only after the session close plus publication buffer"
  silver_sec_sections_to_gold_sec_features:
    left_table: silver_sec_sections
    right_table: gold_sec_features
    keys: [ticker, accession_number]
    temporal_rule: "information_available_ts equals accepted_ts"
  silver_sec_sections_to_gold_sec_chunk_embeddings:
    left_table: silver_sec_sections
    right_table: gold_sec_chunk_embeddings
    keys: [chunk_id]
    temporal_rule: "Embedding availability cannot precede the source chunk availability"
  silver_cot_positions_to_gold_cot_features:
    left_table: silver_cot_positions
    right_table: gold_cot_features
    keys: [mapped_asset, report_date]
    temporal_rule: "information_available_ts equals release_ts"
  silver_sec_sources_to_gold_sec_kg_nodes:
    left_table: silver_sec_entities
    right_table: silver_sec_sections
    keys: [source_chunk_id, chunk_id]
    temporal_rule: "Join within the same accession_number; node provenance is visible from accepted_ts"
    transform: "Deterministic node ID generation and provenance aggregation"
  silver_sec_sources_to_gold_sec_kg_edges:
    left_table: silver_sec_entities
    right_table: silver_sec_sections
    keys: [source_chunk_id, chunk_id]
    temporal_rule: "Join within the same accession_number; edge valid_from equals accepted_ts"
    transform: "Deterministic edge creation, including SUPERSEDES relationships for restatements"

joins:
  latest_feature_asof_prediction:
    tables: [gold_ohlcv_features, gold_options_features, gold_regime_features, gold_cot_features, gold_sec_features, gold_model_features]
    condition: "source.information_available_ts <= target.prediction_ts"
    selection: "For each target row, choose the source row with maximum information_available_ts; use a deterministic key tie-breaker."
    critical: true
  ticker_to_cik:
    tables: [bronze_sec_filings_v2, silver_sec_entities]
    left_keys: [ticker]
    right_keys: [ticker]
    output_key: cik
    rule: "Resolve ticker aliases first and time-bound mappings when issuer-symbol history is available; do not infer CIK from company name."
  section_chunk_to_entity:
    tables: [silver_sec_sections, silver_sec_entities]
    left_keys: [chunk_id]
    right_keys: [source_chunk_id]
    additional_keys: [accession_number]
    rule: "Cast compatible chunk-id representations explicitly and retain accession_number to prevent cross-filing collisions."
  model_feature_assembly:
    tables: [gold_model_features, gold_ohlcv_features, gold_options_features, gold_regime_features, gold_cot_features, gold_sec_features]
    condition: "Each source information_available_ts <= gold_model_features.prediction_ts"
    rule: "Retain every selected source availability timestamp for auditability."
