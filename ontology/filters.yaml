filters:
  point_in_time_universe:
    sql: "EXISTS (SELECT 1 FROM gold_tradable_universe u WHERE u.symbol = source.symbol AND u.as_of_date <= :as_of_date AND u.information_available_ts <= :as_of_ts)"
    tables: [gold_tradable_universe]
    rule: "Use the latest eligible universe snapshot; never use today's membership for historical queries."
  liquidity_rank:
    sql: "med_adv_60d >= :min_med_adv_60d AND adv_rank <= :max_adv_rank"
    tables: [gold_tradable_universe]
  sec_form_type:
    sql: "form_type IN (:form_types)"
    tables: [bronze_sec_filings, bronze_sec_filings_v2, silver_sec_sections, silver_sec_entities, gold_sec_features]
    allowed_examples: [10-K, 10-Q, 8-K]
  event_date_bounds:
    sql: "event_ts >= :start_ts AND event_ts < :end_ts"
    tables: [bronze_ohlcv, silver_ohlcv]
    rule: "Use a half-open interval [start_ts, end_ts)."
  daily_date_bounds:
    sql: "event_date >= :start_date AND event_date < :end_date"
    tables: [bronze_ohlcv_day, bronze_options_day]
    rule: "Use a half-open interval [start_date, end_date)."
  accepted_date_bounds:
    sql: "accepted_ts >= :start_ts AND accepted_ts < :end_ts"
    tables: [bronze_sec_filings, bronze_sec_filings_v2]
    rule: "Filter SEC data by accepted_ts, never filing_date, for PIT analysis."
  pit_no_lookahead:
    sql: "information_available_ts <= :as_of_ts"
    tables: [gold_ohlcv_features, gold_options_features, gold_regime_features, gold_tradable_universe, gold_cot_features, gold_sec_features]
    critical: true
  regular_session_only:
    sql: "is_regular_session = true"
    tables: [silver_ohlcv]
  exclude_bad_quotes:
    sql: "is_stale = false AND is_locked = false AND is_crossed = false"
    tables: [silver_options_quotes]
  cot_forward_fill:
    tables: [silver_cot_positions, gold_cot_features]
    rule: "Forward-fill from release_ts only until the next release; never backward-fill."
