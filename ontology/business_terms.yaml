terms:
  ticker:
    definition: "Canonical uppercase exchange symbol used by market tables. Resolve aliases before filtering or joining. For options, the `underlying` column of a quote/feature row (notebooks/01_ingest_market_data.py) holds this ticker: an option is written on the listed security."
    aliases: [symbol, stock symbol, mapped asset, underlying]
    examples: {BRK.B: BRK-B}
    note: "GOOG (Class C) and GOOGL (Class A) are distinct securities, not ticker aliases. `underlying` is the options spelling of this ticker; a perpetual's reference asset is `perp_underlying`, which is never merged into the ticker."
  cik:
    definition: "SEC Central Index Key, normalized as a zero-padded 10-character string."
    aliases: [SEC issuer id, company CIK]
  registrant:
    definition: "The legal entity that files with the SEC under a CIK. Its current name, SIC code and observed tickers come from silver_sec_registrant; bronze_sec_filings_v2.company_name holds a ticker, not a name."
    aliases: [SEC registrant, filer]
  former_name:
    definition: "A registrant legal name that applied during a past interval published by the SEC; from_date and to_date are inclusive as published."
    aliases: [previous legal name, prior company name]
  sic_code:
    definition: "SEC Standard Industrial Classification code, stored as a string because leading zeros are significant, with its published description."
    aliases: [SIC, standard industrial classification]
  point_in_time_join:
    definition: "As-of join selecting the latest eligible source row whose information_available_ts is not after the prediction timestamp."
    aliases: [PIT join, as-of join, no-look-ahead]
    critical_rule: "Join on information_available_ts; accepted_ts and release_ts are source availability times, while filing_date and report_date are not."
  information_available_ts:
    definition: "Earliest timestamp at which a row's information could have been observed and used."
    aliases: [availability time, info timestamp, PIT timestamp]
  universe:
    definition: "Point-in-time eligible liquid US equities and ETFs represented in gold_tradable_universe; membership must be evaluated as of the requested date."
    aliases: [tradable universe, eligible symbols, coverage universe]
  research_universe:
    definition: "Configuration-driven research/benchmark symbols from config/research_symbols.yaml that receive split-adjusted daily silver_ohlcv_day_adjusted coverage and corporate actions (splits) but are NOT members of the 39-symbol trading/model universe in config/universe.yaml and are never published as trading signals or model features."
    aliases: [research symbols, research coverage group]
    distinct_from: universe
    note: "Currently the ten commodity ETFs in config/research_symbols.yaml. They are omitted from gold_model_features, gold_ohlcv_features and scripts/publish_baseline_signals.py by design, and tests/test_research_symbols_pipeline.py guards that separation. Membership in config/universe.yaml is the line this group never crosses; gold_tradable_universe is a separate ADV screen, so some of these ETFs (e.g. GLD, SLV, IAU, USO) can enter gold_tradable_universe independently by ADV when they are present in bronze_ohlcv_day. This PR does not add them there."
  commodity_etf:
    definition: "ETF whose value tracks a physical commodity or a commodity futures basket; the research group covers GLD, IAU, SLV, SIVR, USO, BNO, UNG, CPER, PPLT and PALL."
    aliases: [commodity ETF]
    note: "Gold and silver funds are typically allocated metal; crude, natural-gas and copper funds hold futures, so their price includes roll yield."
  etf_kind:
    definition: "Backing classification of the commodity ETF wrapper paired with a commodity perp: physical (allocated commodity or metal, i.e. a metal-backed trust) or futures (a futures-based fund holding a contract basket, so contango and roll move its price). The model must account for the difference between the two."
    aliases: [ETF backing kind, ETF structure, physical vs futures ETF]
    values: [physical, futures]
    critical_rule: "A futures ETF carries roll yield, so contango or backwardation moves its price independently of spot; do not read its return as a pure spot-commodity move."
  breadth:
    definition: "Market participation measured here by equal-weight RSP relative to cap-weight SPY at daily cadence."
    aliases: [market breadth, participation, RSP/SPY ratio]
  breadth_regime:
    definition: "Daily BROAD, NARROW, or MIXED classification derived from the RSP/SPY ratio, its 50-day mean, and 20-day slope."
    aliases: [participation regime, market breadth regime]
  residual:
    definition: "Idiosyncratic return left after subtracting fitted systematic factor returns."
    aliases: [epsilon, idiosyncratic return, factor residual]
  s_score:
    definition: "Cumulative residual standardized by its trailing residual volatility; used for residual-mean-reversion entry and exit."
    aliases: [standardized residual, residual z-score]
  implied_volatility:
    definition: "Volatility implied by an option price; historical coverage may be sparse because IV comes from quote snapshots, not daily option bars."
    aliases: [IV, implied vol, iv_atm]
  put_call_ratio:
    definition: "Daily put option volume divided by daily call option volume for an underlying."
    aliases: [put/call, PCR, put call volume ratio]
  split_adjusted_price:
    definition: "A price restated onto a common share basis using corporate-action split ratios. The daily adj_* columns are current-scale back-adjusted display levels and are approved for return calculations, not historical point-in-time price-level features."
    aliases: [adjusted price, back-adjusted price, split adjusted price]
  corporate_action:
    definition: "An issuer event that changes a security or its share basis; the implemented ontology scope currently covers stock splits from bronze_corporate_actions."
    aliases: [issuer action, corp action]
  reverse_split:
    definition: "A stock split that reduces shares outstanding; under the normalized new-shares / old-shares convention its split_ratio is greater than zero and less than one."
    aliases: [reverse stock split, share consolidation]
  cot_crowding:
    definition: "Positioning extremity inferred from trailing CFTC leveraged-money and asset-manager z-scores."
    aliases: [crowding, positioning crowding, COT crowding score]
  accession_number:
    definition: "Stable SEC filing identifier used to connect filings, sections, entities, and filing-level features."
    aliases: [filing accession, accession]
  chunk_id:
    definition: "Stable identifier for a filing text chunk and its embedding; entity source_chunk_id points back to it."
    aliases: [source chunk, filing chunk]
  form_type:
    definition: "SEC filing form such as 10-K, 10-Q, or 8-K."
    aliases: [SEC form, filing type]
  feature_snapshot_id:
    definition: "Identifier linking a signal to the exact point-in-time gold_model_features row used for inference."
    aliases: [feature snapshot, model snapshot]
  signal:
    definition: "A model prediction stored in gold_trading_signals with its probability, model version, and feature snapshot lineage."
    aliases: [trading signal, prediction]
  perpetual_future:
    definition: "A derivative contract with no expiry that tracks a reference asset (perp_underlying) via a venue oracle (Hyperliquid HIP-3 or Binance USD-M). The traded instrument is the perp, never the underlying equity, ETF, fund, preferred or spot commodity."
    aliases: [perp, perpetual, perpetual future contract]
    critical_rule: "Every perps table/row carries instrument_type = perpetual_future and is_derivative = true; never merge a perp into the Security node it tracks."
  perp_underlying:
    definition: "The reference asset a perpetual future tracks through the venue oracle: a listed equity/ETF/fund/preferred ticker, a commodity, or BTC/ETH. Scoped to perpetuals. Distinct from the options `underlying` (an alias of ticker): the perp is a derivative on this reference and is never merged with it."
    aliases: [reference asset, tracked instrument, perp reference asset]
  underlying_type:
    definition: "Perps only: classification of the perpetual's reference asset — equity, etf, fund, preferred, commodity, or crypto. It labels what the perp tracks and never changes the perp's instrument_type."
    aliases: [underlying asset class, perp underlying type]
  funding_rate:
    definition: "Periodic long/short payment on a perpetual future, stored as a decimal per funding interval (not a percentage) with the observed interval recorded per row."
    aliases: [funding, perp funding rate]
  open_interest:
    definition: "Outstanding derivative contracts at a point in time. Hyperliquid's public info API serves current OI only; historical OI is expected from the asset_ctxs flat file once its field list is verified (source s3_backfill), otherwise from forward snapshots, and it is never a candle-derived proxy."
    aliases: [OI, open interest notional]
  mark_price:
    definition: "The venue's mark price for a perpetual future, used for margining; it is a perp price, not the stock price."
    aliases: [mark px, perp mark price]
  oracle_price:
    definition: "The venue oracle/index price a perpetual future settles against; distinct from the perp mark and trade price."
    aliases: [oracle px, index price]
  weekend_window:
    definition: "Closed-market interval [last NYSE regular-session close before the break, next regular-session open after it). Holiday-aware: a Monday holiday ends the window on Tuesday, a Friday holiday starts it on Thursday, and 13:00 early closes move the start."
    aliases: [weekend break, closed-market window]
  closed_market_liquidity:
    definition: "Notional traded per hour while the NYSE is closed, measured from provider 1h candles (bars fully inside the closed interval); the weekend subset is weekend_usd_per_h, whose denominator is the expected hours of every eligible post-listing weekend break in the measurement window — including a break with no bars. Missing hours count as zero notional; breaks ending before the instrument's first observed bar are pre-listing and are not expected (the first bar is only a lower bound on the listing)."
    aliases: [weekend liquidity, closed-hours liquidity]
  liquidity_tier:
    definition: "Descriptive closed-market liquidity bucket from weekend_usd_per_h measured over 2026-08-26..2026-10-21: A >= 250k, B >= 50k, C >= 10k, D < 10k USD per hour. The window covers weekends used in the study, so the static tier is look-ahead: use it for stratification and reporting only, and compute trailing point-in-time liquidity strictly before each weekend for any model input or filter. Never an ingestion filter, and a tier is withheld when bar coverage is below 80% of the expected hours of the eligible post-listing weekend breaks."
    aliases: [tier A-D, weekend liquidity tier]
  new_flag:
    definition: "Review flag for a perpetual whose first available bar is after the liquidity measurement window start, so its history is short relative to the window."
    aliases: [new listing flag, short history flag]
  sparse_flag:
    definition: "Review flag for a perpetual with more than 25% of the expected weekend hours showing zero volume, where hours with no bar count as zero-volume hours; mark coverage must be checked before modelling."
    aliases: [sparse weekend flag, zero-volume flag]
  open_gap:
    definition: "Perps weekend label: the gap from the prior session's raw consolidated close to the first regular session's raw consolidated open after the weekend, restated for splits with one explicit new-shares/old-shares factor — open_gap = session_open * label_split_factor / prev_session_close - 1, where label_split_factor is the product of bronze_corporate_actions.split_ratio for splits with ex_date = session_date (1.0 when none). session_open is the consolidated first regular-session print (Massive daily open), not the primary-listing exchange opening auction print. The label is split-adjusted only until dividend ingestion lands (P1 prerequisite). The dividend_unadjusted flag is declared but not populated in P0 — it is populated only from P1 dividend ingestion, and its absence must not be read as 'no ex-dividend weekend'. Known only at the opening print, never a feature."
    aliases: [opening gap, open gap label]
    critical_rule: "One formula only: open_gap = session_open * label_split_factor / prev_session_close - 1. Raw prices on both sides plus the explicit factor, never a vendor back-adjusted level; the label never appears in a feature column."
  commodity_perp:
    definition: "A perpetual future on a spot commodity (e.g. xyz:GOLD), paired with one or more Massive ETF wrappers for the open-gap label; the wrapper may be physical or futures-based."
    aliases: [commodity perpetual, perp on commodity]
  data_source:
    definition: "Provider code for the upstream system that produced a row: massive, sec_edgar, sec_companyfacts, hyperliquid (venue flat files and info API), binance_um, config, or derived (computed here from other rows). One non-null code per row; a row that mixes sources is derived and records its input sources in lineage."
    aliases: [provider code, lineage source code]
    critical_rule: "Never null and never free text: validate with config/data_sources.py validate_data_source; SQL tables declare data_source STRING NOT NULL with a Unity Catalog column comment, YAML rows declare data_source: and the loader rejects a missing, unknown or venue-contradicting code."
  flat_file_archive:
    definition: "Vendor-published object-store history (Hyperliquid requester-pays S3: node_fills_by_block/node_fills/node_trades, asset_ctxs, misc_events_by_block, optional L2 snapshots; Binance Vision USD-M zips) used as the perps history source instead of API forward capture. Uploads are roughly monthly and the vendor states there is no guarantee of timely updates and data may be missing, so a missing object is a recorded gap."
    aliases: [flat file, flat-file archive, object-store archive]
    critical_rule: "Reading one is a paid download when the bucket is requester-pays: dry-run first, print the object list and estimated transfer cost, require --live, and never read, print or persist credentials."
  append_only_fill_bar:
    definition: "A perp OHLCV bar built from fills, not from the candle API: fills are bucketed by TRADE time in UTC (bar_start = floor(trade_ts / interval), bar_end = the interval boundary), deduplicated on the trade id (symbol, tid) — one row per trade, because a node fill record can be emitted once per counterparty; fill_hash only when the archive has no trade id — and a first bar carries information_available_ts = max(bar_end_ts, availability of the archive object or source fills it was built from). A late fill re-emits the affected bar as an append-only correction whose information_available_ts is when the correcting contents became observable — the latest arrival/ingest timestamp of the late fills — not bar_end_ts, which stays the interval boundary; bars are never interpolated and a bar with no fills is a gap."
    aliases: [fill-built bar, trade-price bar, rebuilt bar]
    critical_rule: "The prices are perp trade (last) prices, never the mark, oracle, equity price or pre-market price; every row keeps instrument_type = perpetual_future and a non-null data_source."
  requester_pays:
    definition: "An S3 bucket whose access charges the requester for requests and data transfer (Hyperliquid node-data and archive buckets). Inspection and download both cost money, so the cost is printed and approved before any GET."
    aliases: [requester-pays bucket, paid archive access]
