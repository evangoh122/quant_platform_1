terms:
  ticker:
    definition: "Canonical uppercase exchange symbol used by market tables. Resolve aliases before filtering or joining."
    aliases: [symbol, stock symbol, mapped asset]
    examples: {BRK.B: BRK-B}
    note: "GOOG (Class C) and GOOGL (Class A) are distinct securities, not ticker aliases."
  cik:
    definition: "SEC Central Index Key, normalized as a zero-padded 10-character string."
    aliases: [SEC issuer id, company CIK]
  registrant:
    definition: "The legal entity that files with the SEC under a CIK. Its current name, SIC code and observed tickers come from silver_sec_registrant; bronze_sec_filings_v2.company_name holds a ticker, not a name."
    aliases: [SEC registrant, filer]
  former_name:
    definition: "A registrant legal name that applied during a past interval published by the SEC; from_date and to_date are inclusive as published."
    aliases: [previous legal name, prior company name]
  sic_code:
    definition: "SEC Standard Industrial Classification code, stored as a string because leading zeros are significant, with its published description."
    aliases: [SIC, standard industrial classification]
  point_in_time_join:
    definition: "As-of join selecting the latest eligible source row whose information_available_ts is not after the prediction timestamp."
    aliases: [PIT join, as-of join, no-look-ahead]
    critical_rule: "Join on information_available_ts; accepted_ts and release_ts are source availability times, while filing_date and report_date are not."
  information_available_ts:
    definition: "Earliest timestamp at which a row's information could have been observed and used."
    aliases: [availability time, info timestamp, PIT timestamp]
  universe:
    definition: "Point-in-time eligible liquid US equities and ETFs represented in gold_tradable_universe; membership must be evaluated as of the requested date."
    aliases: [tradable universe, eligible symbols, coverage universe]
  research_universe:
    definition: "Configuration-driven research/benchmark symbols from config/research_symbols.yaml that receive split-adjusted daily silver_ohlcv_day_adjusted coverage and corporate actions (splits) but are NOT members of the 39-symbol trading/model universe in config/universe.yaml and are never published as trading signals or model features."
    aliases: [research symbols, research coverage group]
    distinct_from: universe
    note: "Currently the ten commodity ETFs in config/research_symbols.yaml. They are omitted from gold_model_features, gold_ohlcv_features and scripts/publish_baseline_signals.py by design, and tests/test_research_symbols_pipeline.py guards that separation. Membership in config/universe.yaml is the line this group never crosses; gold_tradable_universe is a separate ADV screen, so some of these ETFs (e.g. GLD, SLV, IAU, USO) can enter gold_tradable_universe independently by ADV when they are present in bronze_ohlcv_day. This PR does not add them there."
  commodity_etf:
    definition: "ETF whose value tracks a physical commodity or a commodity futures basket; the research group covers GLD, IAU, SLV, SIVR, USO, BNO, UNG, CPER, PPLT and PALL."
    aliases: [commodity ETF]
    note: "Gold and silver funds are typically allocated metal; crude, natural-gas and copper funds hold futures, so their price includes roll yield."
  etf_kind:
    definition: "Backing classification of a commodity ETF: physical (allocated commodity or metal) or futures (basket of futures contracts)."
    aliases: [ETF backing kind]
    values: [physical, futures]
    critical_rule: "A futures ETF carries roll yield, so contango or backwardation moves its price independently of spot; do not read its return as a pure spot-commodity move."
  breadth:
    definition: "Market participation measured here by equal-weight RSP relative to cap-weight SPY at daily cadence."
    aliases: [market breadth, participation, RSP/SPY ratio]
  breadth_regime:
    definition: "Daily BROAD, NARROW, or MIXED classification derived from the RSP/SPY ratio, its 50-day mean, and 20-day slope."
    aliases: [participation regime, market breadth regime]
  residual:
    definition: "Idiosyncratic return left after subtracting fitted systematic factor returns."
    aliases: [epsilon, idiosyncratic return, factor residual]
  s_score:
    definition: "Cumulative residual standardized by its trailing residual volatility; used for residual-mean-reversion entry and exit."
    aliases: [standardized residual, residual z-score]
  implied_volatility:
    definition: "Volatility implied by an option price; historical coverage may be sparse because IV comes from quote snapshots, not daily option bars."
    aliases: [IV, implied vol, iv_atm]
  put_call_ratio:
    definition: "Daily put option volume divided by daily call option volume for an underlying."
    aliases: [put/call, PCR, put call volume ratio]
  split_adjusted_price:
    definition: "A price restated onto a common share basis using corporate-action split ratios. The daily adj_* columns are current-scale back-adjusted display levels and are approved for return calculations, not historical point-in-time price-level features."
    aliases: [adjusted price, back-adjusted price, split adjusted price]
  corporate_action:
    definition: "An issuer event that changes a security or its share basis; the implemented ontology scope currently covers stock splits from bronze_corporate_actions."
    aliases: [issuer action, corp action]
  reverse_split:
    definition: "A stock split that reduces shares outstanding; under the normalized new-shares / old-shares convention its split_ratio is greater than zero and less than one."
    aliases: [reverse stock split, share consolidation]
  cot_crowding:
    definition: "Positioning extremity inferred from trailing CFTC leveraged-money and asset-manager z-scores."
    aliases: [crowding, positioning crowding, COT crowding score]
  accession_number:
    definition: "Stable SEC filing identifier used to connect filings, sections, entities, and filing-level features."
    aliases: [filing accession, accession]
  chunk_id:
    definition: "Stable identifier for a filing text chunk and its embedding; entity source_chunk_id points back to it."
    aliases: [source chunk, filing chunk]
  form_type:
    definition: "SEC filing form such as 10-K, 10-Q, or 8-K."
    aliases: [SEC form, filing type]
  feature_snapshot_id:
    definition: "Identifier linking a signal to the exact point-in-time gold_model_features row used for inference."
    aliases: [feature snapshot, model snapshot]
  signal:
    definition: "A model prediction stored in gold_trading_signals with its probability, model version, and feature snapshot lineage."
    aliases: [trading signal, prediction]
  perpetual_future:
    definition: "A derivative contract with no expiry that tracks an underlying via a venue oracle (Hyperliquid HIP-3 or Binance USD-M). The traded instrument is the perp, never the underlying equity, ETF, fund, preferred or spot commodity."
    aliases: [perp, perpetual, perpetual future contract]
    critical_rule: "Every perps table/row carries instrument_type = perpetual_future and is_derivative = true; never merge a perp into the Security node it tracks."
  underlying:
    definition: "The reference asset a perpetual future tracks through the venue oracle (a listed equity/ETF/fund/preferred ticker, a commodity, or BTC/ETH)."
    aliases: [reference asset, tracked instrument]
  underlying_type:
    definition: "Classification of the reference asset: equity, etf, fund, preferred, commodity, or crypto. It labels what the perp tracks and never changes the perp's instrument_type."
    aliases: [underlying asset class]
  funding_rate:
    definition: "Periodic long/short payment on a perpetual future, stored as a decimal per funding interval (not a percentage) with the observed interval recorded per row."
    aliases: [funding, perp funding rate]
  open_interest:
    definition: "Outstanding derivative contracts at a point in time. Hyperliquid's public info API serves current OI only, so historical OI is a forward-capture or S3-backfill series, never a candle-derived proxy."
    aliases: [OI, open interest notional]
  mark_price:
    definition: "The venue's mark price for a perpetual future, used for margining; it is a perp price, not the stock price."
    aliases: [mark px, perp mark price]
  oracle_price:
    definition: "The venue oracle/index price a perpetual future settles against; distinct from the perp mark and trade price."
    aliases: [oracle px, index price]
  weekend_window:
    definition: "Closed-market interval [last NYSE regular-session close before the break, next regular-session open after it). Holiday-aware: a Monday holiday ends the window on Tuesday, a Friday holiday starts it on Thursday, and 13:00 early closes move the start."
    aliases: [weekend break, closed-market window]
  closed_market_liquidity:
    definition: "Notional traded per hour while the NYSE is closed, measured from provider 1h candles; the weekend subset is weekend_usd_per_h and the input to tiers A-D."
    aliases: [weekend liquidity, closed-hours liquidity]
  liquidity_tier:
    definition: "Closed-market liquidity bucket from weekend_usd_per_h: A >= 250k, B >= 50k, C >= 10k, D < 10k USD per hour. A model input/filter, not an ingestion filter."
    aliases: [tier A-D, weekend liquidity tier]
  new_flag:
    definition: "Review flag for a perpetual whose first available bar is after the liquidity measurement window start, so its history is short relative to the window."
    aliases: [new listing flag, short history flag]
  sparse_flag:
    definition: "Review flag for a perpetual with more than 25% of weekend hours showing zero volume; mark coverage must be checked before modelling."
    aliases: [sparse weekend flag, zero-volume flag]
  commodity_perp:
    definition: "A perpetual future on a spot commodity (e.g. xyz:GOLD), paired with one or more Massive ETF wrappers for the Monday-gap target; the wrapper may be physical or futures-based."
    aliases: [commodity perpetual, perp on commodity]
  etf_kind:
    definition: "Structure of the ETF wrapper paired with a commodity perp: physical (metal-backed trust) or futures (futures-based fund with contango/roll). The model must account for the difference."
    aliases: [ETF structure, physical vs futures ETF]
