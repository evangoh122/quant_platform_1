metrics:
  return_N:
    formula: "close[t] / NULLIF(close[t-N], 0) - 1"
    variants: [return_1m, return_5m, return_15m, return_30m, return_20d]
    source_table: gold_ohlcv_features
  rolling_realized_volatility:
    formula: "STDDEV_SAMP(return_1m) over the trailing N bars"
    variants: [rvol_5m, rvol_15m, rvol_30m]
    source_table: gold_ohlcv_features
  drawdown:
    formula: "equity[t] / MAX(equity[0:t]) - 1"
    source_table: gold_trading_signals
    note: "Maximum drawdown is the absolute value of the minimum drawdown over the evaluation period."
  momentum_N:
    formula: "close[t] / NULLIF(close[t-N], 0) - 1"
    variants: [momentum_5m, momentum_15m, momentum_20d, momentum_12m_ex_1m]
    source_table: gold_ohlcv_features
  med_adv_60d:
    formula: "MEDIAN(close * volume) over the 60 completed trading days strictly before the as_of_date"
    source_table: gold_tradable_universe
  rsp_spy_ratio:
    formula: "close_RSP[t] / NULLIF(close_SPY[t], 0)"
    source_table: gold_regime_features
  breadth_regime:
    formula: "BROAD if rsp_spy_ratio > SMA_50(rsp_spy_ratio) and rsp_spy_ratio / rsp_spy_ratio[t-20] - 1 > 0; NARROW if both comparisons reverse; otherwise MIXED"
    source_table: gold_regime_features
  implied_volatility:
    formula: "Provider implied_volatility for the option nearest ATM; iv_atm selects minimum ABS(strike / underlying_price - 1), with deterministic expiry/contract tie-breaks"
    source_table: gold_options_features
  put_call_ratio:
    formula: "SUM(put volume) / NULLIF(SUM(call volume), 0) by underlying and session"
    source_table: gold_options_features
  cot_crowding_score:
    formula: "(lev_money_zscore_52w + asset_mgr_zscore_52w) / 2"
    source_table: gold_cot_features
    note: "Requires a complete trailing 52-report window; do not backfill before release_ts."
  residual:
    formula: "epsilon[i,t] = return[i,t] - alpha[i] - SUM_k(beta[i,k] * factor_return[k,t])"
    source_table: gold_model_features
  s_score:
    formula: "SUM(epsilon[i,t-L:t]) / NULLIF(STDDEV_SAMP(epsilon[i,t-L:t]), 0)"
    source_table: gold_model_features
    note: "Betas and residual scale must be fitted using observations strictly before the signal timestamp."
  deflated_sharpe_ratio:
    formula: "Phi((SR - Phi^-1(1 - 1/max(n_trials,2))) * SQRT(T-1) / SQRT(1 - skew*SR + ((kurtosis-1)/4)*SR^2))"
    source_table: gold_trading_signals
    note: "SR is annualized; n_trials is the actual number of tested configurations."
