metrics:
  return_N:
    formula: "close[t] / NULLIF(close[t-N], 0) - 1"
    variants: [return_1m, return_5m, return_15m, return_30m]
    source_table: gold_ohlcv_features
  rolling_realized_volatility:
    formula: "STDDEV_SAMP(return_1m) over the trailing N bars"
    variants: [rvol_5m, rvol_15m, rvol_30m]
    source_table: gold_ohlcv_features
  drawdown:
    formula: "equity[t] / MAX(equity[0:t]) - 1"
    computed_in: "ml/evaluate.py:build_backtest"
    note: "Maximum drawdown is the minimum (non-positive) drawdown over the evaluation period."
  momentum_N:
    formula: "close[t] / NULLIF(close[t-N], 0) - 1"
    variants: [momentum_5m, momentum_15m]
    source_table: gold_ohlcv_features
  med_adv_60d:
    formula: "MEDIAN(close * volume) over the 60 completed trading days strictly before the as_of_date"
    source_table: gold_tradable_universe
  rsp_spy_ratio:
    formula: "close_RSP[t] / NULLIF(close_SPY[t], 0)"
    source_table: gold_regime_features
  breadth_regime:
    formula: "BROAD if rsp_spy_ratio > SMA_50(rsp_spy_ratio) and rsp_spy_ratio / rsp_spy_ratio[t-20] - 1 > 0; NARROW if both comparisons reverse; otherwise MIXED"
    source_table: gold_regime_features
  rsp_spy_ratio_zscore_252:
    formula: "(rsp_spy_ratio - trailing 252-session mean) / trailing 252-session sample standard deviation"
    source_table: gold_regime_features
  implied_volatility:
    formula: "iv_atm is provider implied_volatility from the quote with maximum open_interest per (symbol, date), ordered by open_interest DESC NULLS LAST then strike ASC"
    source_table: gold_options_features
    notes: "The name says ATM, but the implementation selects maximum open interest; no underlying_price participates in the calculation."
  put_call_ratio:
    formula: "SUM(put volume) / NULLIF(SUM(call volume), 0) by underlying and session"
    source_table: gold_options_features
    note: "The current gold SQL compares uppercase PUT/CALL, while bronze ingestion emits lowercase call/put; normalize case before relying on the computed metric."
  cot_crowding_score:
    formula: "(lev_money_zscore_52w + asset_mgr_zscore_52w) / 2"
    source_table: gold_cot_features
    note: "Requires a complete trailing 52-report window; do not backfill before release_ts."
  residual:
    formula: "epsilon[i,t] = return[i,t] - alpha[i] - SUM_k(beta[i,k] * factor_return[k,t])"
    computed_in: "strategies/residual_reversion.py:compute_residuals"
  s_score:
    formula: "s_cum / sigma, where s_cum is the rolling sum of residuals over L=5 observations and sigma is the trailing sample standard deviation of residuals over the 60-day estimation window"
    computed_in: "strategies/residual_reversion.py:compute_residuals"
    note: "s_cum requires all L observations; sigma uses min_obs observations, default ceil(0.8 * 60)=48. Betas are fitted strictly before the signal timestamp."
  deflated_sharpe_ratio:
    formula: "Phi((SR - Phi^-1(1 - 1/max(n_trials,2))) * SQRT(T-1) / SQRT(1 - skew*SR + ((kurtosis-1)/4)*SR^2))"
    computed_in: "ml/evaluate.py:deflated_sharpe_ratio"
    note: "SR is annualized; n_trials is the actual number of tested configurations."
