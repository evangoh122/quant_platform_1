# config/perp_universe.yaml — companies whose equity perpetuals are ingested for weekend research.
# ONLY tickers listed here are ingested. Owner selection 2026-10-22: all 78 qp1-universe single stocks with a Hyperliquid HIP-3 perp.
# Liquidity is measured WHILE NYSE IS CLOSED (owner 2026-10-22), from 1h candles (notional = volume x close):
#   weekend_usd_per_h = mean hourly notional over the EXPECTED hours of the covered weekend breaks (Fri 16:00 ET -> Mon 09:30 ET,
#   holiday-extended; a missing hour counts as zero, notional = volume x close, bars must be fully inside the break);
#   closed_usd_per_h = bars fully outside every session. A tier proposal is withheld below 80% expected-hour coverage.
#   window 2026-08-26 -> 2026-10-21 (8 weeks). Tiers on weekend_usd_per_h: A >= 250k, B >= 50k, C >= 10k, D < 10k.
#   flags: new = first bar after window start (short history); sparse = >25% of expected weekend hours with zero volume,
#   where missing hours count as zero volume (an empty weekend is missing data, not full coverage).
#   Denominator = expected hours of EVERY eligible post-listing weekend break (bars are the numerator, the calendar the
#   denominator; pre-listing breaks are not expected).
# OPEN-GAP LABEL (one executable formula, identical in docs/data/PERPS_WEEKEND_PLAN.md, docs/DATA_SCHEMAS.md and
# ontology/README.md; split_ratio is new shares / old shares):
#   label_split_factor = product of split_ratio for splits with ex_date = session_date (1.0 when none)
#   open_gap = session_open * label_split_factor / prev_session_close - 1
# session_open is the raw consolidated open (not the listing-exchange auction print); the label is SPLIT-ADJUSTED ONLY
# until dividend ingestion lands (P1 prerequisite: bronze_corporate_actions has no dividend amounts).
# Re-measure monthly (scripts/perps/measure_closed_liquidity.py, P1). Tiers/flags are DESCRIPTIVE stratification only: the
# static values were measured after most study weekends (look-ahead), so any model input/filter must use trailing point-in-time
# liquidity computed only from data before each window start. They are never ingestion filters.
# Underlying classification from the round-1 ticker check (owner 2026-10-22): BOT -> fund, STRC -> preferred, KSTR -> etf.
# All three stay in the universe; the perpetual remains the traded instrument and the label only names what it tracks.
# DATA SOURCE (owner 2026-10-22): every row carries ONE provider code from config/data_sources.py in `data_source`:
# Hyperliquid HIP-3 rows -> hyperliquid; Binance USD-M controls -> binance_um. The loader rejects a missing/unknown code
# and a code that contradicts the row's venue.
version: 4
# INSTRUMENT TYPE (owner 2026-10-22): every row below is a PERPETUAL FUTURE (a derivative contract on a crypto venue), NOT the equity,
# NOT an ETF and NOT a spot commodity. The listed ticker/ETF is only the UNDERLYING it tracks via the venue's oracle. Every downstream table,
# Unity Catalog comment/tag, knowledge-graph node and UI label must carry instrument_type = perpetual_future.
instrument_defaults: {instrument_type: perpetual_future, is_equity: false, is_derivative: true, contract: linear_perpetual, quote_currency: USDC, trades_24x7: true}
liquidity_window: {start: "2026-08-26", end: "2026-10-21", basis: weekend_closed_market_hours}
controls:  # always ingested: market-wide weekend risk proxies
  - {instrument_type: perpetual_future, underlying_type: crypto, underlying: BTC, venue: binance_usdm, data_source: binance_um, symbol: BTCUSDT, quote_currency: USDT}
  - {instrument_type: perpetual_future, underlying_type: crypto, underlying: ETH, venue: binance_usdm, data_source: binance_um, symbol: ETHUSDT, quote_currency: USDT}
companies:
  - {ticker: SNDK, instrument_type: perpetual_future, underlying_type: equity, underlying: SNDK, venue: hyperliquid, data_source: hyperliquid, dex: xyz, symbol: "xyz:SNDK", tier: A, weekend_usd_per_h: 2378072, closed_usd_per_h: 3890249, zero_volume_weekend_share: 0, first_bar: "2026-08-26", flags: []}
