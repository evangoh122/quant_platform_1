[pytest]
testpaths = tests
pythonpath = .
addopts = -p tests.hermetic
timeout = 30
markers =
    render_install: marks tests that install into a clean venv (deselect with '-m "not render_install"')
    slow: marks tests that are slow and may need extended timeout (deselect with '-m "not slow"')
    databricks: marks tests that need a live Databricks workspace (deselect with '-m "not databricks"')
    spark: marks tests that need PySpark / Databricks Connect (deselect with '-m "not spark"')
    lakebase: marks tests that need a live Lakebase instance (deselect with '-m "not lakebase"')
    network: marks tests that need real outbound network access (deselect with '-m "not network"')